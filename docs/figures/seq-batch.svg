<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 568" width="900" height="568" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#16191f">
<title>Sequence: Batch tidy-up (optional)</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16191f"/></marker></defs>
<rect x="40" y="10" width="150" height="44" fill="#ffffff" stroke="#16191f" stroke-width="1.5"/>
<text x="115" y="31" text-anchor="middle" font-weight="700">Pipeline</text>
<text x="115" y="47" text-anchor="middle" font-size="12" fill="#5d6470">code</text>
<line x1="115" y1="54" x2="115" y2="518" stroke="#d5d9df" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="270" y="10" width="150" height="44" fill="#ffffff" stroke="#16191f" stroke-width="1.5"/>
<text x="345" y="31" text-anchor="middle" font-weight="700">AI model</text>
<text x="345" y="47" text-anchor="middle" font-size="12" fill="#5d6470">in Claude Code</text>
<line x1="345" y1="54" x2="345" y2="518" stroke="#d5d9df" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="500" y="10" width="150" height="44" fill="#ffffff" stroke="#16191f" stroke-width="1.5"/>
<text x="575" y="31" text-anchor="middle" font-weight="700">MCP server</text>
<text x="575" y="47" text-anchor="middle" font-size="12" fill="#5d6470">checks</text>
<line x1="575" y1="54" x2="575" y2="518" stroke="#d5d9df" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="730" y="10" width="150" height="44" fill="#ffffff" stroke="#16191f" stroke-width="1.5"/>
<text x="805" y="31" text-anchor="middle" font-weight="700">Record</text>
<text x="805" y="47" text-anchor="middle" font-size="12" fill="#5d6470">database + log</text>
<line x1="805" y1="54" x2="805" y2="518" stroke="#d5d9df" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="115" y1="80" x2="343" y2="80" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="230" y="73" text-anchor="middle">&quot;Tidy up batch b (n interviews)&quot;</text>
<line x1="345" y1="114" x2="573" y2="114" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460" y="107" text-anchor="middle">read interview notes and what did not fit</text>
<line x1="575" y1="148" x2="347" y2="148" stroke="#16191f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="460" y="141" text-anchor="middle">notes</text>
<line x1="345" y1="182" x2="573" y2="182" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460" y="175" text-anchor="middle">find near-duplicate concepts</text>
<line x1="575" y1="216" x2="347" y2="216" stroke="#16191f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="460" y="209" text-anchor="middle">evidence for each</text>
<line x1="345" y1="250" x2="573" y2="250" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460" y="243" text-anchor="middle">merge duplicates, with a reason</text>
<line x1="575" y1="284" x2="803" y2="284" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="690" y="277" text-anchor="middle">merged; the old ones stay in the history</text>
<line x1="345" y1="318" x2="573" y2="318" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460" y="311" text-anchor="middle">propose rules for what keeps recurring</text>
<line x1="345" y1="352" x2="573" y2="352" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460" y="345" text-anchor="middle">batch note</text>
<rect x="250" y="368" width="410" height="60" rx="4" fill="#fde7da" stroke="#c2410c" stroke-width="1.2"/>
<text x="258" y="382" font-size="12" font-weight="700" fill="#c2410c">if it cites no interview notes</text>
<line x1="575" y1="406" x2="347" y2="406" stroke="#16191f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="460" y="399" text-anchor="middle">refused</text>
<line x1="345" y1="450" x2="573" y2="450" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460" y="443" text-anchor="middle">checkpoint</text>
<line x1="575" y1="484" x2="803" y2="484" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="690" y="477" text-anchor="middle">run waits</text>
<rect x="40" y="524" width="840" height="36" rx="3" fill="#fde7da" stroke="#c2410c"/>
<text x="460" y="547" text-anchor="middle">Stop: the researcher reviews the batch and approves rules.</text>
</svg>
