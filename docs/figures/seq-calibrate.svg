<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 598" width="900" height="598" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#16191f">
<title>Sequence: Calibration</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16191f"/></marker></defs>
<rect x="40" y="10" width="150" height="44" fill="#ffffff" stroke="#16191f" stroke-width="1.5"/>
<text x="115" y="31" text-anchor="middle" font-weight="700">Pipeline</text>
<text x="115" y="47" text-anchor="middle" font-size="12" fill="#5d6470">code</text>
<line x1="115" y1="54" x2="115" y2="548" stroke="#d5d9df" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="270" y="10" width="150" height="44" fill="#ffffff" stroke="#16191f" stroke-width="1.5"/>
<text x="345" y="31" text-anchor="middle" font-weight="700">AI model</text>
<text x="345" y="47" text-anchor="middle" font-size="12" fill="#5d6470">in Claude Code</text>
<line x1="345" y1="54" x2="345" y2="548" stroke="#d5d9df" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="500" y="10" width="150" height="44" fill="#ffffff" stroke="#16191f" stroke-width="1.5"/>
<text x="575" y="31" text-anchor="middle" font-weight="700">MCP server</text>
<text x="575" y="47" text-anchor="middle" font-size="12" fill="#5d6470">checks</text>
<line x1="575" y1="54" x2="575" y2="548" stroke="#d5d9df" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="730" y="10" width="150" height="44" fill="#ffffff" stroke="#16191f" stroke-width="1.5"/>
<text x="805" y="31" text-anchor="middle" font-weight="700">Record</text>
<text x="805" y="47" text-anchor="middle" font-size="12" fill="#5d6470">database + log</text>
<line x1="805" y1="54" x2="805" y2="548" stroke="#d5d9df" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="115" y1="80" x2="343" y2="80" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="230" y="73" text-anchor="middle">&quot;Calibrate on interviews 1 … k&quot;</text>
<line x1="345" y1="114" x2="573" y2="114" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460" y="107" text-anchor="middle">read the brief, method guide, how-to guides</text>
<line x1="575" y1="148" x2="347" y2="148" stroke="#16191f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="460" y="141" text-anchor="middle">brief, guides</text>
<rect x="250" y="164" width="630" height="260" rx="4" fill="none" stroke="#5d6470" stroke-width="1.2"/>
<text x="258" y="178" font-size="12" font-weight="700" fill="#5d6470">↻ for each of the k interviews</text>
<line x1="345" y1="202" x2="573" y2="202" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460" y="195" text-anchor="middle">open the interview</text>
<line x1="575" y1="236" x2="347" y2="236" stroke="#16191f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="460" y="229" text-anchor="middle">transcript by segment</text>
<line x1="345" y1="270" x2="573" y2="270" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460" y="263" text-anchor="middle">add concept + quote + reason</text>
<rect x="262" y="286" width="386" height="60" rx="4" fill="#fde7da" stroke="#c2410c" stroke-width="1.2"/>
<text x="270" y="300" font-size="12" font-weight="700" fill="#c2410c">if the quote is not in the interview</text>
<line x1="575" y1="324" x2="347" y2="324" stroke="#16191f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="460" y="317" text-anchor="middle">refused, nothing saved</text>
<line x1="575" y1="368" x2="803" y2="368" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="690" y="361" text-anchor="middle">save + log</text>
<line x1="345" y1="402" x2="573" y2="402" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460" y="395" text-anchor="middle">notes: who, what did not fit, doubts</text>
<line x1="345" y1="446" x2="573" y2="446" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460" y="439" text-anchor="middle">propose codebook rules</text>
<line x1="345" y1="480" x2="573" y2="480" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460" y="473" text-anchor="middle">checkpoint: summary + questions</text>
<line x1="575" y1="514" x2="803" y2="514" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="690" y="507" text-anchor="middle">run waits; writes blocked</text>
<rect x="40" y="554" width="840" height="36" rx="3" fill="#fde7da" stroke="#c2410c"/>
<text x="460" y="577" text-anchor="middle">Stop: the researcher approves rules, answers the questions, or forks.</text>
</svg>
