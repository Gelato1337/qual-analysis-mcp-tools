<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 632" width="900" height="632" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#16191f">
<title>Sequence: 2nd-order themes</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16191f"/></marker></defs>
<rect x="40" y="10" width="150" height="44" fill="#ffffff" stroke="#16191f" stroke-width="1.5"/>
<text x="115" y="31" text-anchor="middle" font-weight="700">Pipeline</text>
<text x="115" y="47" text-anchor="middle" font-size="12" fill="#5d6470">code</text>
<line x1="115" y1="54" x2="115" y2="582" stroke="#d5d9df" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="270" y="10" width="150" height="44" fill="#ffffff" stroke="#16191f" stroke-width="1.5"/>
<text x="345" y="31" text-anchor="middle" font-weight="700">AI model</text>
<text x="345" y="47" text-anchor="middle" font-size="12" fill="#5d6470">in Claude Code</text>
<line x1="345" y1="54" x2="345" y2="582" stroke="#d5d9df" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="500" y="10" width="150" height="44" fill="#ffffff" stroke="#16191f" stroke-width="1.5"/>
<text x="575" y="31" text-anchor="middle" font-weight="700">MCP server</text>
<text x="575" y="47" text-anchor="middle" font-size="12" fill="#5d6470">checks</text>
<line x1="575" y1="54" x2="575" y2="582" stroke="#d5d9df" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="730" y="10" width="150" height="44" fill="#ffffff" stroke="#16191f" stroke-width="1.5"/>
<text x="805" y="31" text-anchor="middle" font-weight="700">Record</text>
<text x="805" y="47" text-anchor="middle" font-size="12" fill="#5d6470">database + log</text>
<line x1="805" y1="54" x2="805" y2="582" stroke="#d5d9df" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="115" y1="80" x2="343" y2="80" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="230" y="73" text-anchor="middle">&quot;Build the themes&quot;</text>
<line x1="345" y1="114" x2="573" y2="114" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460" y="107" text-anchor="middle">read the brief, incl. prior research; how-to</text>
<line x1="575" y1="148" x2="347" y2="148" stroke="#16191f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="460" y="141" text-anchor="middle">brief, guide</text>
<line x1="345" y1="182" x2="573" y2="182" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460" y="175" text-anchor="middle">list all concepts and notes</text>
<line x1="575" y1="216" x2="347" y2="216" stroke="#16191f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="460" y="209" text-anchor="middle">all concepts</text>
<rect x="250" y="232" width="630" height="226" rx="4" fill="none" stroke="#5d6470" stroke-width="1.2"/>
<text x="258" y="246" font-size="12" font-weight="700" fill="#5d6470">↻ for each group of concepts</text>
<line x1="345" y1="270" x2="573" y2="270" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460" y="263" text-anchor="middle">evidence for unclear concepts</text>
<line x1="575" y1="304" x2="347" y2="304" stroke="#16191f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="460" y="297" text-anchor="middle">quotes + notes</text>
<line x1="345" y1="338" x2="573" y2="338" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460" y="331" text-anchor="middle">add theme + concepts + a reason each</text>
<rect x="262" y="354" width="386" height="60" rx="4" fill="#fde7da" stroke="#c2410c" stroke-width="1.2"/>
<text x="270" y="368" font-size="12" font-weight="700" fill="#c2410c">if fewer than 2, or a concept is already placed</text>
<line x1="575" y1="392" x2="347" y2="392" stroke="#16191f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="460" y="385" text-anchor="middle">refused</text>
<line x1="575" y1="436" x2="803" y2="436" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="690" y="429" text-anchor="middle">save + log</text>
<line x1="345" y1="480" x2="573" y2="480" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460" y="473" text-anchor="middle">notes on concepts that fit nowhere</text>
<line x1="345" y1="514" x2="573" y2="514" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460" y="507" text-anchor="middle">checkpoint</text>
<line x1="575" y1="548" x2="803" y2="548" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="690" y="541" text-anchor="middle">run waits</text>
<rect x="40" y="588" width="840" height="36" rx="3" fill="#fde7da" stroke="#c2410c"/>
<text x="460" y="611" text-anchor="middle">Stop: the researcher regroups, groups by hand, or forks.</text>
</svg>
