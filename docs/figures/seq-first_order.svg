<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#16191f">
<title>Sequence: 1st-order (interview i)</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16191f"/></marker></defs>
<rect x="40" y="10" width="150" height="44" fill="#ffffff" stroke="#16191f" stroke-width="1.5"/>
<text x="115" y="31" text-anchor="middle" font-weight="700">Pipeline</text>
<text x="115" y="47" text-anchor="middle" font-size="12" fill="#5d6470">code</text>
<line x1="115" y1="54" x2="115" y2="450" stroke="#d5d9df" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="270" y="10" width="150" height="44" fill="#ffffff" stroke="#16191f" stroke-width="1.5"/>
<text x="345" y="31" text-anchor="middle" font-weight="700">AI model</text>
<text x="345" y="47" text-anchor="middle" font-size="12" fill="#5d6470">in Claude Code</text>
<line x1="345" y1="54" x2="345" y2="450" stroke="#d5d9df" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="500" y="10" width="150" height="44" fill="#ffffff" stroke="#16191f" stroke-width="1.5"/>
<text x="575" y="31" text-anchor="middle" font-weight="700">MCP server</text>
<text x="575" y="47" text-anchor="middle" font-size="12" fill="#5d6470">checks</text>
<line x1="575" y1="54" x2="575" y2="450" stroke="#d5d9df" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="730" y="10" width="150" height="44" fill="#ffffff" stroke="#16191f" stroke-width="1.5"/>
<text x="805" y="31" text-anchor="middle" font-weight="700">Record</text>
<text x="805" y="47" text-anchor="middle" font-size="12" fill="#5d6470">database + log</text>
<line x1="805" y1="54" x2="805" y2="450" stroke="#d5d9df" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="115" y1="80" x2="343" y2="80" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="230" y="73" text-anchor="middle">&quot;Code interview i&quot;</text>
<line x1="345" y1="114" x2="573" y2="114" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460" y="107" text-anchor="middle">ask for the codebook and transcript</text>
<line x1="575" y1="148" x2="347" y2="148" stroke="#16191f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="460" y="141" text-anchor="middle">rules, earlier notes, transcript of i</text>
<line x1="345" y1="182" x2="573" y2="182" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460" y="175" text-anchor="middle">add concept + quote + reason</text>
<rect x="250" y="198" width="410" height="94" rx="4" fill="#fde7da" stroke="#c2410c" stroke-width="1.2"/>
<text x="258" y="212" font-size="12" font-weight="700" fill="#c2410c">if the quote is not in interview i</text>
<line x1="575" y1="236" x2="347" y2="236" stroke="#16191f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="460" y="229" text-anchor="middle">refused, nothing saved</text>
<line x1="345" y1="270" x2="573" y2="270" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460" y="263" text-anchor="middle">re-read, try again with the exact words</text>
<line x1="575" y1="314" x2="803" y2="314" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="690" y="307" text-anchor="middle">save + log the event</text>
<line x1="345" y1="348" x2="573" y2="348" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460" y="341" text-anchor="middle">same idea as an earlier concept? add the quote to it</text>
<line x1="345" y1="382" x2="573" y2="382" stroke="#16191f" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="460" y="375" text-anchor="middle">write notes on interview i</text>
<line x1="345" y1="416" x2="117" y2="416" stroke="#16191f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="230" y="409" text-anchor="middle">done</text>
<rect x="40" y="456" width="840" height="36" rx="3" fill="#e9ecf1" stroke="#d5d9df"/>
<text x="460" y="479" text-anchor="middle">Next interview: a new session with no memory. It reads the record instead.</text>
</svg>
